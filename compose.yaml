services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ivy
      POSTGRES_PASSWORD: ivy
      POSTGRES_DB: ivy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./backend
    environment:
      IVY_DATABASE_URL: postgresql+psycopg://ivy:ivy@db:5432/ivy
      IVY_CORS_ORIGINS: '["http://localhost:5173"]'
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
