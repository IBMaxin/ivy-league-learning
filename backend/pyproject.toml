[project]
name = "ivy-backend"
version = "0.1.0"
description = "Ivy League Learning API (SOC 2 aligned baseline)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.116.1",
  "pydantic==2.9.2",
  "pydantic-settings==2.5.0",
  "uvicorn[standard]==0.30.6",
]

[project.optional-dependencies]
dev = [
  "httpx==0.27.2",      # required by fastapi.testclient
  "pytest==8.3.4",
  "ruff==0.6.9",        # lint (SOC: static analysis in CI)
  "pip-audit==2.7.3",   # vuln scan (SOC CC7.3)
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "S", "B", "A", "UP"]  # S=bandit security rules
ignore = ["B008"]  # B008 conflicts with FastAPI Depends() idiom

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # asserts are standard in pytest

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false  # backend is an app, not a dist package (uv sync runs without install)
